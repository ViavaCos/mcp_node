# mcp-server/deploy/docker-compose.yml
# 一键编排 data-server + mcp-server（路线 A）
# 启动：在 mcp-server/ 目录执行  docker compose -f deploy/docker-compose.yml up -d
# 对外暴露 mcp-server:8089；生产请在前方再叠加 nginx（见 nginx.conf.example）做 HTTPS + 鉴权
services:
  data-server:
    build: ../data-server
    environment:
      DATA_SERVER_PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped

  mcp-server:
    build: .
    environment:
      TRANSPORT: "http"
      PORT: "8089"
      DATA_SERVER_URL: "http://data-server:3000"
      # 设置后 MCP 端点强制 Bearer 鉴权；留空则不鉴权（仅建议内网/演示）
      MCP_TOKEN: "${MCP_TOKEN:-}"
    ports:
      - "8089:8089"
    depends_on:
      - data-server
    restart: unless-stopped
